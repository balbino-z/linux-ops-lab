server {
    listen 80 default_server;
    server_name _;

    root /var/www/opslab;
    index index.html;

    access_log /var/log/opslab/access.log;
    error_log  /var/log/opslab/error.log;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
